body {

margin: 0;
padding: 0;

background-color: #000;
color: #fff;
padding: 20px 40px;

}

.header-container h1 {
margin: 0;
font-size: 32px;
font-family: var(--font-numbers);
text-transform: uppercase;
letter-spacing: 2px;
font-weight: 900;
font-style: italic;
text-align: center;
}

.grid-container {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
gap: 15px;
padding: 0 40px 40px;
max-width: 1400px;
margin: 0 auto;
}

.card {
background-color: var(--card-bg);
border-radius: 8px;
padding: 15px;
box-shadow: 0 2px 5px rgba(0,0,0,0.1);
position: relative;
overflow: hidden;
display: flex;
flex-direction: column;
transition: transform 0.2s;
}

.card.up-next {
background-color: var(--card-dark-bg);
color: var(--text-light);
}

.card.live {
background-color: var(--red);
color: var(--text-light);
border: 2px solid var(--red);
cursor: pointer;
box-shadow: 0 0 15px rgba(227, 0, 27, 0.4);
}

.card.live .date-range,
.card.live .race-num,
.card.live .match-teams,
.card.live .match-city {
color: var(--text-light);
}

.card.live:hover { transform: translateY(-3px); }
.card:hover { border: 2px solid var(--red); }

.date-range {
font-size: 13px;
color: var(--text-gray);
margin-bottom: 5px;
font-weight: 600;
letter-spacing: 0.5px;
}

.card.up-next .date-range { color: #aaaaaa; }

.group-title {
font-size: 20px;
font-weight: 700;

align-items: center;

font-size: 18px;

}

font-weight: 700;
margin-bottom: 6px;
}

font-size: 11px;

text-transform: uppercase;
font-weight: 600;

.card.up-next .match-city { color: #999999; }

position: absolute;

right: 0;

font-weight: 700;

// Helper: Convert Date and UK Time into Local Browser Date Object

    let timeStr = ukTimeStr.replace('.', ':'); // Fix formats like "12.30am"
    let hours = 0, minutes = 0;

    // Parse Time
    if (timeStr.toLowerCase().includes('am') || timeStr.toLowerCase().includes('pm')) {
        const match = timeStr.match(/(\d+):?(\d+)?\s*(am|pm)/i);
        if (match) {
            hours = parseInt(match[1]);
            minutes = match[2] ? parseInt(match[2]) : 0;
            const period = match[3].toLowerCase();
            if (period === 'pm' && hours < 12) hours += 12;
            if (period === 'am' && hours === 12) hours = 0;
        }
    } else {
        const parts = timeStr.split(':');
        hours = parseInt(parts[0] || 0);
        minutes = parseInt(parts[1] || 0);
    }

    const paddedHours = String(hours).padStart(2, '0');
    const paddedMinutes = String(minutes).padStart(2, '0');
    
    // Create ISO String explicitly assigning +01:00 (BST)
    const isoString = `${dateStr}T${paddedHours}:${paddedMinutes}:00+01:00`;
    return new Date(isoString);
}

// Format local date for display
function formatLocalDate(dateObj) {
    const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
    return dateObj.toLocaleString(undefined, options);
}

function renderCards(forceLive = false) {
    const grid = document.getElementById('schedule-grid');
    grid.innerHTML = '';

    const now = new Date().getTime();
    let foundUpcoming = false;

    schedule.forEach(match => {
        // Calculate original kickoff time
        const matchStart = getLocalTime(match.date, match.ukTime);
        
        // LIVE WINDOW LOGIC (125 minutes total)
        // Starts 15 minutes before kickoff
        const liveStartMs = matchStart.getTime() - (15 * 60 * 1000);
        // Ends 110 minutes after kickoff (15 mins before + 110 mins after = 125 mins)
        const liveEndMs = matchStart.getTime() + (110 * 60 * 1000); 

        let labelHtml = '';
        let classList = 'card';
        let onclickEvent = '';

        // Status Logic Based on the New 125-Minute Window
        if (now > liveEndMs) {
            classList += ' finished';
            labelHtml = '<div class="status-label label-finished">FINISHED</div>';
        } else if (now >= liveStartMs && now <= liveEndMs) {
            classList += ' live';
            labelHtml = '<div class="status-label label-live">LIVE</div>';
            onclickEvent = 'onclick="openLiveStream()"';
        } else if (!foundUpcoming) {
            if (forceLive) {
                classList += ' live';
                labelHtml = '<div class="status-label label-live">LIVE</div>';
                onclickEvent = 'onclick="openLiveStream()"';
            } else {
                classList += ' up-next';
                labelHtml = '<div class="status-label label-up-next">UP NEXT</div>';
            }
            foundUpcoming = true;
        }

        const cardHtml = `
        <div class="${classList}" ${onclickEvent}>
            ${labelHtml}
            <div class="date-range">${formatLocalDate(matchStart)}</div>
            <h2 class="group-title">Group <span class="race-num" style="margin-left: 5px;">${match.group}</span></h2>
            <div class="match-teams">${match.home} <br>vs<br> ${match.away}</div>
            <div class="match-city">📍 ${match.city}</div>
        </div>
        `;
        grid.innerHTML += cardHtml;
    });
}
const modal = document.getElementById('video-modal');
const iframe = document.getElementById('video-frame');
const btns = document.querySelectorAll('.source-btns button');

function openLiveStream() {
    modal.classList.add('active');
    changeSource(1);
}

function closeModal() {
    modal.classList.remove('active');
    iframe.src = '';
}

function changeSource(sourceNum) {
    iframe.src = sources[sourceNum];
    btns.forEach((btn, index) => {
        if(index + 1 === sourceNum) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
}

document.addEventListener('keydown', (e) => {
    if (e.key === "Escape" && modal.classList.contains('active')) {
        closeModal();
    }
});

document.getElementById('forceLiveToggle').addEventListener('change', (e) => {
    renderCards(e.target.checked);
});

// Initial Render
renderCards();

</script>
